<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ClearMark</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- Markdown editor -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Environment Configuration -->
    <meta name="supabase-url" content="https://your-project-ref.supabase.co">
    <meta name="supabase-anon-key" content="your-supabase-anon-key">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Environment loader -->
    <script src="js/env.js"></script>
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="admin-container">
            <div class="admin-header">
                <h1>Blog Management</h1>
                <button id="createPostBtn" class="btn btn-primary">Create New Post</button>
            </div>

            <div class="admin-content">
                <!-- Post List -->
                <div class="admin-section">
                    <h2>All Posts</h2>
                    <div id="postsList" class="posts-list">
                        <p>Loading posts...</p>
                    </div>
                </div>

                <!-- Create/Edit Post Form -->
                <div id="postForm" class="post-form" style="display: none;">
                    <h2 id="formTitle">Create Post</h2>
                    <form id="postFormElement">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="postTitle">Title <span class="required">*</span></label>
                                <input type="text" id="postTitle" class="form-input" placeholder="Enter post title" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="postSlug">Slug (URL-friendly)</label>
                                <input type="text" id="postSlug" class="form-input" placeholder="auto-generated from title">
                                <small class="form-help">Leave empty to auto-generate from title</small>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="postExcerpt">Excerpt</label>
                                <textarea id="postExcerpt" class="form-textarea" rows="3" placeholder="Brief summary of the post (optional)"></textarea>
                                <small class="form-help">A short description shown in post listings</small>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group form-group-half">
                                <label for="postTags">Tags</label>
                                <input type="text" id="postTags" class="form-input" placeholder="AI, Technology, Tutorial">
                                <small class="form-help">Comma-separated tags</small>
                            </div>
                            <div class="form-group form-group-half">
                                <label for="postFeaturedImage">Featured Image URL</label>
                                <input type="text" id="postFeaturedImage" class="form-input" placeholder="https://example.com/image.jpg">
                                <small class="form-help">Optional cover image</small>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="postContent">Content (Markdown) <span class="required">*</span></label>
                            <textarea id="postContent" class="form-textarea" rows="20" placeholder="Write your post content in Markdown..." required></textarea>
                            <small class="form-help">Supports Markdown formatting</small>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="postPublished">
                                <span>Publish immediately</span>
                            </label>
                            <small class="form-help">Uncheck to save as draft</small>
                        </div>

                        <p id="formMessage" class="auth-message" style="display: none;"></p>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <span id="saveButtonText">Save Post</span>
                            </button>
                            <button type="button" id="cancelBtn" class="btn btn-outline">Cancel</button>
                            <button type="button" id="deleteBtn" class="btn btn-error" style="display: none;">Delete Post</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="js/common.js?v=4"></script>
    <script src="js/auth.js?v=4"></script>
    <script src="js/blog.js?v=4"></script>
    <script>
        const API_URL = window.env?.API_URL || 'http://localhost:8000';
        let currentPostId = null;

        // Check authentication and admin status
        async function checkAuth() {
            if (typeof window.initAuthManager === 'function') {
                window.initAuthManager();
            }

            let authManager = window.authManager;
            if (!authManager) {
                for (let i = 0; i < 10; i++) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    authManager = window.authManager;
                    if (authManager) break;
                }
            }

            if (!authManager || !authManager.currentUser) {
                window.location.href = 'login.html?message=Please log in to access admin panel';
                return false;
            }

            // Check if user is admin
            try {
                const token = await authManager.getAccessToken();
                const response = await fetch(`${API_URL}/api/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch user info');
                }

                const userData = await response.json();
                console.log('User data:', userData);
                console.log('User metadata:', userData.user_metadata);

                const isAdmin = userData.user_metadata?.is_admin === true ||
                               userData.user_metadata?.is_admin === 'true';

                if (!isAdmin) {
                    alert('Access denied. Admin privileges required.');
                    window.location.href = 'index.html';
                    return false;
                }

                return true;
            } catch (error) {
                console.error('Error checking admin status:', error);
                alert('Failed to verify admin status');
                window.location.href = 'index.html';
                return false;
            }
        }

        // Load posts
        async function loadPosts() {
            console.log('🔵 loadPosts() called');
            try {
                const listEl = document.getElementById('postsList');
                listEl.innerHTML = '<p>Loading posts...</p>';
                console.log('🔵 Set loading message');

                // Wait for blogManager to be available
                if (!window.blogManager) {
                    console.log('⏳ Waiting for blogManager to load...');
                    for (let i = 0; i < 20; i++) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        if (window.blogManager) {
                            console.log('✅ blogManager loaded successfully');
                            break;
                        }
                    }
                }

                if (!window.blogManager) {
                    throw new Error('blogManager is not defined. Failed to load blog.js');
                }

                console.log('🔵 Calling window.blogManager.getPosts(0, 100, null, false)');
                // Load all posts (both published and draft) for admin
                const posts = await window.blogManager.getPosts(0, 100, null, false);
                console.log('✅ Posts loaded:', posts);
                console.log('📊 Number of posts:', posts ? posts.length : 0);

                displayPosts(posts);
                console.log('✅ displayPosts() called');
            } catch (error) {
                console.error('❌ Error loading posts:', error);
                console.error('❌ Error stack:', error.stack);
                const listEl = document.getElementById('postsList');
                listEl.innerHTML = `<p class="error">Failed to load posts. ${error.message || 'Unknown error'}</p>`;
            }
        }

        // Display posts
        function displayPosts(posts) {
            console.log('🔵 displayPosts() called with:', posts);
            const listEl = document.getElementById('postsList');

            if (!posts || posts.length === 0) {
                console.log('⚠️ No posts to display');
                listEl.innerHTML = '<p>No posts found. Create your first post!</p>';
                return;
            }

            console.log('🔵 Rendering', posts.length, 'posts');

            listEl.innerHTML = posts.map(post => {
                const createdDate = post.created_at ? new Date(post.created_at).toLocaleDateString() : 'N/A';
                const updatedDate = post.updated_at && post.updated_at !== post.created_at 
                    ? new Date(post.updated_at).toLocaleDateString() 
                    : null;
                const tags = post.tags && Array.isArray(post.tags) ? post.tags.join(', ') : (post.tags || '');
                const excerpt = post.excerpt || (post.content ? post.content.substring(0, 100) + '...' : '');
                
                return `
                <div class="post-item">
                    <div class="post-item-header">
                        <h3>${post.title || 'Untitled'}</h3>
                        <span class="post-status ${post.published ? 'published' : 'draft'}">${post.published ? 'Published' : 'Draft'}</span>
                    </div>
                    ${excerpt ? `<p class="post-excerpt">${excerpt}</p>` : ''}
                    ${tags ? `<div class="post-tags">Tags: ${tags}</div>` : ''}
                    <div class="post-item-meta">
                        <span>Created: ${createdDate}</span>
                        ${updatedDate ? `<span>Updated: ${updatedDate}</span>` : ''}
                    </div>
                    <div class="post-item-actions">
                        <button class="btn btn-sm btn-primary" onclick="editPost('${post.id}')">Edit</button>
                        <button class="btn btn-sm btn-error" onclick="deletePost('${post.id}')">Delete</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Edit post
        window.editPost = async function(postId) {
            try {
                const post = await window.blogManager.getPost(postId);
                currentPostId = postId;

                document.getElementById('formTitle').textContent = 'Edit Post';
                document.getElementById('postTitle').value = post.title || '';
                document.getElementById('postSlug').value = post.slug || '';
                document.getElementById('postExcerpt').value = post.excerpt || '';

                // Handle tags - could be array or string
                const tagsValue = post.tags
                    ? (Array.isArray(post.tags) ? post.tags.join(', ') : post.tags)
                    : '';
                document.getElementById('postTags').value = tagsValue;

                document.getElementById('postFeaturedImage').value = post.featured_image || '';
                document.getElementById('postContent').value = post.content || '';
                document.getElementById('postPublished').checked = post.published || false;
                document.getElementById('deleteBtn').style.display = 'inline-block';

                // Reset form message
                const messageEl = document.getElementById('formMessage');
                messageEl.style.display = 'none';
                messageEl.textContent = '';

                document.getElementById('postForm').style.display = 'block';
                document.getElementById('postForm').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Error loading post:', error);
                alert(`Failed to load post: ${error.message || 'Unknown error'}`);
            }
        }

        // Delete post
        window.deletePost = async function(postId) {
            if (!confirm('Are you sure you want to delete this post? This action cannot be undone.')) return;

            try {
                await window.blogManager.deletePost(postId);
                
                // If deleting the currently edited post, hide the form
                if (currentPostId === postId) {
                    hideForm();
                }
                
                // Reload posts list
                loadPosts();
                
                // Show success message
                const listEl = document.getElementById('postsList');
                const successMsg = document.createElement('div');
                successMsg.className = 'success-message';
                successMsg.textContent = 'Post deleted successfully!';
                successMsg.style.cssText = 'padding: 12px; background: #D1FAE5; color: #065F46; border-radius: 6px; margin-bottom: 16px;';
                listEl.insertBefore(successMsg, listEl.firstChild);
                
                setTimeout(() => {
                    if (successMsg.parentNode) {
                        successMsg.parentNode.removeChild(successMsg);
                    }
                }, 3000);
            } catch (error) {
                console.error('Error deleting post:', error);
                alert(`Failed to delete post: ${error.message || 'Unknown error'}`);
            }
        }

        // Hide form
        function hideForm() {
            document.getElementById('postForm').style.display = 'none';
            document.getElementById('postFormElement').reset();
            currentPostId = null;
            document.getElementById('deleteBtn').style.display = 'none';
            document.getElementById('formTitle').textContent = 'Create Post';
        }

        // Generate slug from title
        function generateSlug(title) {
            return title.toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .trim();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🔵 DOMContentLoaded event fired');
            const isAuth = await checkAuth();
            console.log('🔵 checkAuth() returned:', isAuth);
            if (isAuth) {
                console.log('✅ User is authenticated, calling loadPosts()');
                loadPosts();

                // Check for edit parameter in URL (both query param and hash)
                const urlParams = new URLSearchParams(window.location.search);
                const editParamFromQuery = urlParams.get('edit');
                const hash = window.location.hash;
                const editParamFromHash = hash.startsWith('#edit-') ? hash.substring(6) : null;
                const editParam = editParamFromQuery || editParamFromHash;

                if (editParam) {
                    // Wait a bit for posts to load, then edit the specified post
                    setTimeout(() => {
                        editPost(editParam);
                    }, 500);
                }

                // Event listeners
                document.getElementById('createPostBtn').addEventListener('click', () => {
                    hideForm();
                    document.getElementById('postForm').style.display = 'block';
                    document.getElementById('postForm').scrollIntoView({ behavior: 'smooth' });
                });

                document.getElementById('cancelBtn').addEventListener('click', hideForm);

                document.getElementById('postTitle').addEventListener('input', (e) => {
                    const slugEl = document.getElementById('postSlug');
                    if (!slugEl.value || slugEl.dataset.autoGenerated) {
                        slugEl.value = generateSlug(e.target.value);
                        slugEl.dataset.autoGenerated = 'true';
                    }
                });

                document.getElementById('postSlug').addEventListener('input', (e) => {
                    e.target.dataset.autoGenerated = '';
                });

                document.getElementById('deleteBtn').addEventListener('click', async () => {
                    if (currentPostId) {
                        await deletePost(currentPostId);
                    }
                });

                document.getElementById('postFormElement').addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const title = document.getElementById('postTitle').value.trim();
                    if (!title) {
                        alert('Title is required');
                        return;
                    }

                    const content = document.getElementById('postContent').value.trim();
                    if (!content) {
                        alert('Content is required');
                        return;
                    }

                    const slug = document.getElementById('postSlug').value.trim() || generateSlug(title);
                    const excerpt = document.getElementById('postExcerpt').value.trim();
                    const tagsInput = document.getElementById('postTags').value.trim();
                    const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];
                    const featuredImage = document.getElementById('postFeaturedImage').value.trim();
                    const published = document.getElementById('postPublished').checked;

                    const postData = {
                        title,
                        slug,
                        excerpt: excerpt || null,
                        tags,
                        content,
                        featured_image: featuredImage || null,
                        published
                    };

                    const messageEl = document.getElementById('formMessage');
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    const saveButtonText = document.getElementById('saveButtonText');
                    const originalText = saveButtonText.textContent;

                    submitBtn.disabled = true;
                    saveButtonText.textContent = 'Saving...';
                    messageEl.style.display = 'none';
                    messageEl.textContent = '';

                    try {
                        let post;
                        if (currentPostId) {
                            post = await window.blogManager.updatePost(currentPostId, postData);
                        } else {
                            post = await window.blogManager.createPost(postData);
                        }

                        messageEl.className = 'auth-message success';
                        messageEl.textContent = currentPostId ? 'Post updated successfully!' : 'Post created successfully!';
                        messageEl.style.display = 'block';

                        setTimeout(() => {
                            loadPosts();
                            hideForm();
                        }, 1000);
                    } catch (error) {
                        console.error('Error saving post:', error);
                        messageEl.className = 'auth-message error';
                        messageEl.textContent = error.message || 'Failed to save post';
                        messageEl.style.display = 'block';
                    } finally {
                        submitBtn.disabled = false;
                        saveButtonText.textContent = originalText;
                    }
                });
            }
        });
    </script>
</body>
</html>
